[package]
name = "sloos"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["form", "http1", "tokio", "tower-log", "tracing"] }
getrandom = "0.4.2"
hex = "0.4.3"
rusqlite = { version = "0.39.0", features = ["bundled", "cache"] }
sha2 = "0.11.0"
tokio = { version = "1.52.0", features = ["rt-multi-thread", "macros", "net", "time", "signal", "process", "sync"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.15.0"
tower = { version = "0.5.3", features = ["util"] }
